        policy_required_help: Every administrator must pair a passkey or an authenticator app. Without it they only reach the setup page.
        policy_required_short: required
        policy_optional: Optional
        policy_optional_help: Administrators decide themselves whether to turn it on. Those who paired a method, or whose 2FA was reset, are asked for it.
        policy_optional_short: optional
        policy_disabled: Turned off
        policy_disabled_help: Nobody is asked for a second factor. Paired methods stay on the accounts and work again once the policy is changed.
        policy_disabled_short: turned off
        help: This is the only shop-wide 2FA setting. Resetting or turning off 2FA for a single administrator is done on their page in Administrators.
